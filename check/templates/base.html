<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ config.APP_TITLE }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  window.APP_BASE = "{{ request.script_root }}";
  (function(){ var f = window.fetch;
    window.fetch = function(u, o){ if (typeof u === "string" && u.charAt(0) === "/" && u.indexOf(APP_BASE + "/") !== 0) u = APP_BASE + u; return f(u, o); }; })();
  window.U = function(p){ return (typeof p === "string" && p.charAt(0) === "/" && p.indexOf(APP_BASE + "/") !== 0) ? APP_BASE + p : p; };
</script>
<style>
  .app-tabs{ display:flex; background:#11233a; }
  .app-tabs a{ padding:11px 22px; color:#cdd8e6; text-decoration:none; font-weight:700; font-size:15px; border-right:1px solid #1f3a5f; }
  .app-tabs a.active{ background:#f4f6f9; color:#11233a; }
  .app-tabs a:hover:not(.active){ background:#1c3454; color:#fff; }
</style></head>
<body>
<div class="app-tabs"><a href="/work/">運転記録</a><a href="/check/" class="active">チェックリスト</a></div>
<header class="app-title">{{ config.APP_TITLE }}</header>
<div class="topbar">
<div class="nav">
  <a href="{{ url_for('pages.record', key=current.key) if current else url_for('pages.index') }}" class="{{ 'on' if mode=='record' else '' }}">点検入力</a> |
  <a href="{{ url_for('pages.history', key=current.key) if current else '#' }}" class="{{ 'on' if mode=='history' else '' }}">過去の点検結果</a>{% if current %} |
  <a href="{{ url_for('layout.editor', key=current.key) }}">記入位置の設定</a>{% endif %}
</div></div>
{% if equipments %}
<div class="tabs">{% for e in equipments %}
<a href="{{ url_for('pages.record', key=e.key) if mode!='history' else url_for('pages.history', key=e.key) }}" class="{{ 'on' if current and e.key==current.key else '' }}">{{ e.name }}</a>
{% endfor %}</div>{% endif %}
{% block body %}{% endblock %}
<script>(function(){ try{ document.body.classList.add("font-" + (localStorage.getItem("check_fontsize")||"normal")); }catch(e){} })();</script>
</body></html>
