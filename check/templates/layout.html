<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記入位置の設定 - {{ name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='layout.css') }}">
<script>
  window.APP_BASE = "{{ request.script_root }}";
  (function(){ var f = window.fetch;
    window.fetch = function(u, o){ if (typeof u === "string" && u.charAt(0) === "/" && u.indexOf(APP_BASE + "/") !== 0) u = APP_BASE + u; return f(u, o); }; })();
  window.U = function(p){ return (typeof p === "string" && p.charAt(0) === "/" && p.indexOf(APP_BASE + "/") !== 0) ? APP_BASE + p : p; };
</script></head>
<body>
<div class="lo-top">
  <div class="lo-title">記入位置の設定：{{ name }}</div>
  <div class="lo-actions">
    <label>ページ <select id="page-select"></select></label>
    <button id="save-btn" class="lo-save">保存</button>
    <a href="{{ url_for('pages.record', key=key) }}" class="lo-back">点検入力へ戻る</a>
  </div>
</div>
<div class="lo-body">
  <div class="lo-stagewrap"><div id="stage" class="lo-stage"><img id="form-img" alt="様式"></div></div>
  <div class="lo-side">
    <div class="lo-sec">項目一覧（未配置はクリックで現在ページへ）</div>
    <div id="field-list" class="lo-list"></div>
    <div class="lo-sec">選択中の設定</div>
    <div id="panel" class="lo-panel"><p class="lo-muted">項目を選んでください</p></div>
  </div>
</div>
<script>window.LAYOUT_KEY = {{ key|tojson }};</script>
<script src="{{ url_for('static', filename='layout.js') }}"></script>
</body></html>
